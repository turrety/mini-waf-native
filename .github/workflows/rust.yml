name: Rust

on:
  push:
    branches: [master]
    paths:
      - "rust/**"
      - "rust-ffi/**"
      - "c/include/mini_waf.h"
      - "Cargo.*"
      - "rustfmt.toml"
      - "README.md"
      - ".github/workflows/rust.yml"
  pull_request:
    paths:
      - "rust/**"
      - "rust-ffi/**"
      - "c/include/mini_waf.h"
      - "Cargo.*"
      - "rustfmt.toml"
      - "README.md"
      - ".github/workflows/rust.yml"

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest # Linux x64
          - ubuntu-24.04-arm # Linux arm64
          - windows-latest # Windows x64
          - windows-11-arm # Windows arm64
          - macos-latest # macOS arm64 (Apple Silicon)
          - macos-15-intel # macOS x64
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test --workspace --all-targets
      - run: cargo test --workspace --doc

  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.85"
      - run: cargo test --workspace --all-targets

  test-32-bit:
    name: test (i686 Linux, armv7 check)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: i686-unknown-linux-gnu, armv7-unknown-linux-gnueabihf
      - run: sudo apt-get update && sudo apt-get install -y gcc-multilib
      - run: cargo test --workspace --target i686-unknown-linux-gnu
      # No ARM linker on the runner: type-check every target instead.
      - run: >-
          cargo check --workspace --all-targets
          --target armv7-unknown-linux-gnueabihf

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: rustfmt
      - run: cargo +nightly fmt --check
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - run: cargo clippy --workspace --all-targets
      - run: cargo doc --no-deps
        env:
          RUSTDOCFLAGS: -D warnings
