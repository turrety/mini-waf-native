name: Java

on:
  push:
    branches: [master]
    paths:
      - "java/**"
      - "rust/**"
      - "rust-ffi/**"
      - "Cargo.*"
      - ".github/workflows/java.yml"
  pull_request:
    paths:
      - "java/**"
      - "rust/**"
      - "rust-ffi/**"
      - "Cargo.*"
      - ".github/workflows/java.yml"

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest # Linux x64
          - ubuntu-24.04-arm # Linux arm64
          - windows-latest # Windows x64
          - windows-11-arm # Windows arm64
          - macos-latest # macOS arm64 (Apple Silicon)
          - macos-15-intel # macOS x64
        include:
          - java: "22"
            distribution: temurin
          # No vendor ships JDK 22 for Windows on ARM; test there on the
          # 25 LTS, which runs the same --release 22 bytecode.
          - os: windows-11-arm
            java: "25"
            distribution: zulu
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo build --release -p mini-waf-ffi
      - uses: actions/setup-java@v5
        with:
          distribution: ${{ matrix.distribution }}
          java-version: ${{ matrix.java }}
      - run: mvn -B test
        working-directory: java

  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "22"
      - name: Checkstyle
        run: mvn -B checkstyle:check
        working-directory: java
